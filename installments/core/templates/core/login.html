{% extends 'core/base.html' %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh;">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="card stat">
      <div class="card-body p-4">
        <h3 class="text-center mb-4">تسجيل الدخول</h3>
        {% if form.errors %}
          <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill ms-2"></i>
            اسم المستخدم أو كلمة المرور غير صحيحة.
          </div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">اسم المستخدم</label>
            <input type="text" name="username" id="id_username" class="form-control" placeholder="اسم المستخدم" autofocus required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">كلمة المرور</label>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="كلمة المرور" required>
          </div>
          <input type="hidden" name="next" value="{{ next|default:'/' }}">
          <button type="submit" class="btn btn-primary w-100">دخول</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
