{% extends 'core/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2 class="mb-3">{{ title }}</h2>
<div class="card stat"><div class="card-body"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">حفظ</button> <a class="btn btn-outline-secondary" href="{% url 'core:customer_list' %}">رجوع</a></form></div></div>
{% endblock %}
