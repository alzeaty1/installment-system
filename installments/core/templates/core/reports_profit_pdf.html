<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>body{font-family:sans-serif;direction:rtl}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px}.money{white-space:nowrap}</style></head><body><h1>تقرير الأرباح</h1><p>إجمالي الربح: <strong>{{  total_profit|mask_money }}</strong></p><table><thead><tr><th>العقد</th><th>العميل</th><th>الفائدة</th><th>الربح</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.contract.contract_number }}</td><td>{{ row.contract.customer.name }}</td><td class="money">{{  row.contract.total_interest|mask_money }}</td><td class="money">{{  row.profit|mask_money }}</td></tr>{% empty %}<tr><td colspan="4">لا توجد بيانات.</td></tr>{% endfor %}</tbody></table></body></html>
